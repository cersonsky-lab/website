<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:image" content="{{ site.baseurl }}/assets/img/group_photo_06_2026.jpeg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  </head>
  <body>
      <div class="wrapper">
          <header>

              <h1><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
              <a href="{{ site.baseurl }}/"><img src="{{site.logo | relative_url}}" alt="Logo" /></a>

                  <p>{{ site.description | default: site.github.project_tagline }}</p>

                  <strong><a>Rose K. Cersonsky</a> &nbsp(<a href="https://rosecersonsky.com/CV.pdf">CV</a> | <a href="https://www.rosecersonsky.com">Webpage</a>)</strong><br>
                  {% for link in site.data.navigation %}
                  <strong><a href="{{ site.baseurl }}{{ link.url }}">{{ link.title }}</a></strong><br>
                  {% endfor %}
                  <br><strong><a href="https://github.com/cersonsky-lab"> GitHub</a><br></strong>
                  Last Updated: {{ site.time | date: "%m/%d/%Y" }}
</header>
          <section>

              {{ content }}

          </section>
      </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
